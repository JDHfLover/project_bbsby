[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["team", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"experiments/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
"src/crypto.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
